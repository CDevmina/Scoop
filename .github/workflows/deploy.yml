name: Build and deploy

# Builds the API image, pushes it to GitHub Container Registry, rolls it out
# to Azure Container Apps, deploys the frontend to Azure Static Web Apps and
# re-seeds the demo data. The nightly run only re-seeds, so showtimes always
# cover the next seven days and demo bookings are cleared.
# One-time setup: deploy/azure/setup.sh

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "43 20 * * *" # 02:13 in Colombo

permissions:
  contents: read
  packages: write
  id-token: write # Azure login via OIDC

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/cdevmina/scoop-api

jobs:
  api:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Roll out new image
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update -n scoop-api -g "${{ vars.AZURE_RESOURCE_GROUP }}" --image "$IMAGE:$GITHUB_SHA" -o none

  frontend:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # No PayPal client ID: the site runs in demo payment mode
        run: npm ci && npm run build
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true

  seed:
    needs: [api, frontend]
    if: always() && (github.event_name == 'schedule' || needs.api.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Seed demo data
        working-directory: backend
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          PUBLIC_API_URL: ${{ vars.VITE_API_URL }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: npm ci --omit=dev && npm run seed
